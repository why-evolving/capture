name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Documentation and privacy
        run: |
          python3 scripts/check-docs.py
          python3 scripts/check-publication.py
      - name: Report validator regression
        run: python3 scripts/check-native-report.py --self-test
      - name: Core tests
        run: zsh scripts/test.sh
      - name: Compile app without private signing credentials
        run: swift build -c release
